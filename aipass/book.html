<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                📚 ร้านหนังสือออนไลน์
            </h1>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input type="text" id="search-input" placeholder="ค้นหาชื่อหนังสือ..." class="px-4 py-2 rounded-lg text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 w-full sm:w-64">
                <select id="category-select" class="px-4 py-2 rounded-lg text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300">
                    <option value="all">ทุกหมวดหมู่</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Tech">Tech</option>
                    <option value="Business">Business</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">
        
        <!-- Catalog Section -->
        <section class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-slate-700">รายการหนังสือทั้งหมด</h2>
            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Catalog items injected via JS -->
            </div>
        </section>

        <!-- Cart & Checkout Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-fit">
            <h2 class="text-xl font-bold mb-4 text-slate-700 flex items-center justify-between">
                <span>🛒 ตะกร้าสินค้า</span>
            </h2>
            
            <div id="cart-list" class="divide-y divide-slate-100 max-h-80 overflow-y-auto mb-4 flex-grow">
                <!-- Cart items injected via JS -->
            </div>

            <div class="border-t border-slate-100 pt-4 space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-500">ยอดรวม (Subtotal):</span>
                    <span><span id="subtotal-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between text-emerald-600">
                    <span>ส่วนลด (Discount):</span>
                    <span>-<span id="discount-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between text-slate-500">
                    <span>ค่าจัดส่ง (Shipping Fee):</span>
                    <span><span id="tax-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between font-bold text-lg text-slate-800 pt-2 border-t border-slate-100">
                    <span>ยอดสุทธิ (Grand Total):</span>
                    <span class="text-indigo-600"><span id="grand-total-val">0.00</span> บาท</span>
                </div>
            </div>

            <div class="mt-6 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">ชื่อสมาชิกผู้สั่งซื้อ</label>
                    <input type="text" id="customer-input" placeholder="กรอกชื่อ-นามสกุลของคุณ" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
                </div>
                <button id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm">
                    ยืนยันการสั่งซื้อ
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-4 text-center text-xs text-slate-400">
        &copy; BookStore System. All rights reserved.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const booksData = [
            { id: 1, title: "The Silent Forest", category: "Fiction", price: 180 },
            { id: 2, title: "Midnight Star", category: "Fiction", price: 220 },
            { id: 3, title: "Startup Zero", category: "Business", price: 280 },
            { id: 4, title: "Financial Freedom", category: "Business", price: 320 },
            { id: 5, title: "Clean Python Architecture", category: "Tech", price: 450 },
            { id: 6, title: "Deep Learning Systems", category: "Tech", price: 550 }
        ];

        let cart = [];

        // DOM Elements
        const searchInput = document.getElementById('search-input');
        const categorySelect = document.getElementById('category-select');
        const catalogGrid = document.getElementById('catalog-grid');
        const cartList = document.getElementById('cart-list');
        const subtotalVal = document.getElementById('subtotal-val');
        const discountVal = document.getElementById('discount-val');
        const taxVal = document.getElementById('tax-val');
        const grandTotalVal = document.getElementById('grand-total-val');
        const customerInput = document.getElementById('customer-input');
        const checkoutBtn = document.getElementById('checkout-btn');

        // Load cart state from localStorage
        function loadCartState() {
            const saved = localStorage.getItem('app_cart_state');
            if (saved) {
                try {
                    cart = JSON.parse(saved);
                } catch (e) {
                    cart = [];
                }
            }
        }

        // Save cart state to localStorage
        function saveCartState() {
            localStorage.setItem('app_cart_state', JSON.stringify(cart));
        }

        // Render catalog based on filter and search
        function renderCatalog() {
            const keyword = searchInput.value.toLowerCase().trim();
            const selectedCategory = categorySelect.value;

            const filtered = booksData.filter(book => {
                const matchKeyword = book.title.toLowerCase().includes(keyword);
                const matchCategory = selectedCategory === 'all' || book.category === selectedCategory;
                return matchKeyword && matchCategory;
            });

            if (filtered.length === 0) {
                catalogGrid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">ไม่พบหนังสือที่คุณค้นหา</div>`;
                return;
            }

            catalogGrid.innerHTML = filtered.map(book => `
                <div class="catalog-item bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col justify-between gap-3">
                    <div>
                        <span class="inline-block px-2 py-0.5 text-xs font-semibold bg-indigo-50 text-indigo-600 rounded-full mb-2">${book.category}</span>
                        <h3 class="font-bold text-slate-800">${book.title}</h3>
                        <p class="text-indigo-600 font-semibold mt-1">${book.price.toFixed(2)} บาท</p>
                    </div>
                    <button data-id="${book.id}" class="add-btn w-full bg-slate-900 hover:bg-indigo-600 text-white text-sm py-2 rounded-lg transition-colors">
                        หยิบใส่ตะกร้า
                    </button>
                </div>
            `).join('');
        }

        // Render cart list and financial values
        function renderCart() {
            if (cart.length === 0) {
                cartList.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">ตะกร้าสินค้าว่างเปล่า</div>`;
            } else {
                cartList.innerHTML = cart.map(item => `
                    py-3 flex justify-between items-center gap-2">
                    <div class="flex-grow">
                        <h4 class="text-sm font-semibold text-slate-800">${item.title}</h4>
                        <p class="text-xs text-slate-500">${item.price.toFixed(2)} บาท x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button data-id="${item.id}" class="qty-dec w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-xs font-bold">-</button>
                        <span class="text-xs font-semibold w-6 text-center">${item.quantity}</span>
                        <button data-id="${item.id}" class="qty-inc w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded text-xs font-bold">+</button>
                        <button data-id="${item.id}" class="remove-btn ml-2 text-rose-500 hover:text-rose-700 text-xs font-medium">ลบ</button>
                    </div>
                </div>`).join('').replace(/py-3/g, 'div class="py-3'); // Clean up template formatting
            }

            calculateTotals();
        }

        // Calculate financials
        function calculateTotals() {
            let subtotal = 0;
            let totalQty = 0;

            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                totalQty += item.quantity;
            });

            let discount = totalQty >= 3 ? 80.00 : 0.00;
            let shippingFee = totalQty > 0 ? 50.00 : 0.00;
            let grandTotal = Math.max(0, subtotal - discount) + shippingFee;

            subtotalVal.textContent = subtotal.toFixed(2);
            discountVal.textContent = discount.toFixed(2);
            taxVal.textContent = shippingFee.toFixed(2);
            grandTotalVal.textContent = grandTotal.toFixed(2);
        }

        // Event Listeners for Catalog Filters
        searchInput.addEventListener('input', renderCatalog);
        categorySelect.addEventListener('change', renderCatalog);

        // Event Listener for Adding to Cart
        catalogGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('add-btn')) {
                const bookId = parseInt(e.target.getAttribute('data-id'));
                const book = booksData.find(b => b.id === bookId);
                if (book) {
                    const existing = cart.find(item => item.id === bookId);
                    if (existing) {
                        existing.quantity += 1;
                    } else {
                        cart.push({ id: book.id, title: book.title, price: book.price, quantity: 1 });
                    }
                    saveCartState();
                    renderCart();
                }
            }
        });

        // Event Listener for Cart Actions (inc, dec, remove)
        cartList.addEventListener('click', (e) => {
            const bookId = parseInt(e.target.getAttribute('data-id'));
            if (!bookId) return;

            const index = cart.findIndex(item => item.id === bookId);
            if (index === -1) return;

            if (e.target.classList.contains('qty-inc')) {
                cart[index].quantity += 1;
            } else if (e.target.classList.contains('qty-dec')) {
                cart[index].quantity -= 1;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            } else if (e.target.classList.contains('remove-btn')) {
                cart.splice(index, 1);
            }

            saveCartState();
            renderCart();
        });

        // Checkout Validation & Persistence
        checkoutBtn.addEventListener('click', () => {
            const customerName = customerInput.value.trim();
            
            if (cart.length === 0) {
                alert('กรุณาเลือกหนังสืออย่างน้อย 1 เล่มลงในตะกร้า');
                return;
            }

            if (!customerName) {
                alert('กรุณากรอกชื่อสมาชิกผู้สั่งซื้อ');
                customerInput.focus();
                return;
            }

            const orderData = {
                customer: customerName,
                items: [...cart],
                subtotal: subtotalVal.textContent,
                discount: discountVal.textContent,
                shippingFee: taxVal.textContent,
                grandTotal: grandTotalVal.textContent,
                timestamp: new Date().toISOString()
            };

            localStorage.setItem('app_last_order', JSON.stringify(orderData));
            alert('ยืนยันการสั่งซื้อสำเร็จ!');
            
            // Clear cart after successful checkout
            cart = [];
            saveCartState();
            renderCart();
            customerInput.value = '';
        });

        // Initial Setup
        loadCartState();
        renderCatalog();
        renderCart();
    </script>
</body>
</html>
