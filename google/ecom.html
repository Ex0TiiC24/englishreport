<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online E-Commerce Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- Header & Navigation / Search / Filter -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-indigo-600">E-Commerce Store</h1>
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <input type="text" id="search-input" placeholder="ค้นหาสินค้า..." class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-64">
                <select id="category-select" class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">ทุกหมวดหมู่</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Audio">Audio</option>
                    <option value="Gadgets">Gadgets</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Catalog Section -->
        <section class="lg:col-span-2">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">รายการสินค้า</h2>
            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Products rendered dynamically -->
            </div>
        </section>

        <!-- Cart & Checkout Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit sticky top-24">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">ตะกร้าสินค้า</h2>
            
            <div id="cart-list" class="divide-y divide-gray-100 max-h-72 overflow-y-auto mb-6 pr-1">
                <!-- Cart items rendered dynamically -->
            </div>

            <!-- Financial Summary -->
            <div class="space-y-2 text-sm border-t border-gray-100 pt-4 text-gray-600">
                <div class="flex justify-between">
                    <span>ยอดรวม (Subtotal):</span>
                    <span><span id="subtotal-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between text-emerald-600">
                    <span>ส่วนลด (Discount):</span>
                    <span>-<span id="discount-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between">
                    <span>ภาษีมูลค่าเพิ่ม (VAT 7%):</span>
                    <span><span id="tax-val">0.00</span> บาท</span>
                </div>
                <div class="flex justify-between font-bold text-base text-gray-900 border-t border-gray-100 pt-2">
                    <span>ยอดสุทธิ (Grand Total):</span>
                    <span><span id="grand-total-val">0.00</span> บาท</span>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="mt-6 space-y-4">
                <div>
                    <label for="customer-input" class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-ที่อยู่สำหรับจัดส่ง</label>
                    <textarea id="customer-input" rows="3" placeholder="กรอกชื่อและที่อยู่ลูกค้า..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <button id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-150">ยืนยันการสั่งซื้อ</button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-sm text-gray-500">
        &copy; 2026 E-Commerce Store. All rights reserved.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Module 1: Catalog Data
        const products = [
            { id: 1, name: "Wireless Mouse", category: "Accessories", price: 400 },
            { id: 2, name: "USB-C Hub", category: "Accessories", price: 600 },
            { id: 3, name: "Bluetooth Speaker", category: "Audio", price: 1200 },
            { id: 4, name: "Noise-Canceling Earbuds", category: "Audio", price: 1500 },
            { id: 5, name: "Mechanical Keyboard", category: "Gadgets", price: 2200 },
            { id: 6, name: "Smart Watch Pro", category: "Gadgets", price: 3000 }
        ];

        // Persistent Cart State
        let cart = JSON.parse(localStorage.getItem('app_cart_state')) || [];

        // DOM Elements
        const catalogGrid = document.getElementById('catalog-grid');
        const searchInput = document.getElementById('search-input');
        const categorySelect = document.getElementById('category-select');
        const cartList = document.getElementById('cart-list');
        const subtotalVal = document.getElementById('subtotal-val');
        const discountVal = document.getElementById('discount-val');
        const taxVal = document.getElementById('tax-val');
        const grandTotalVal = document.getElementById('grand-total-val');
        const customerInput = document.getElementById('customer-input');
        const checkoutBtn = document.getElementById('checkout-btn');

        // Save Cart to LocalStorage
        function saveCartState() {
            localStorage.setItem('app_cart_state', JSON.stringify(cart));
        }

        // Module 2: Render Catalog & Real-time Filter/Search
        function renderCatalog() {
            const keyword = searchInput.value.toLowerCase().trim();
            const selectedCategory = categorySelect.value;

            const filteredProducts = products.filter(product => {
                const matchesKeyword = product.name.toLowerCase().includes(keyword);
                const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
                return matchesKeyword && matchesCategory;
            });

            if (filteredProducts.length === 0) {
                catalogGrid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12">ไม่พบสินค้าที่คุณค้นหา</p>`;
                return;
            }

            catalogGrid.innerHTML = filteredProducts.map(product => `
                <div class="catalog-item bg-white p-5 rounded-xl border border-gray-100 shadow-sm flex flex-col justify-between transition hover:shadow-md">
                    <div>
                        <span class="inline-block text-xs font-medium bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full mb-3">${product.category}</span>
                        <h3 class="font-semibold text-lg text-gray-800">${product.name}</h3>
                    </div>
                    <div class="mt-6 flex items-center justify-between">
                        <span class="text-indigo-600 font-bold text-lg">${product.price.toFixed(2)} บาท</span>
                        <button data-id="${product.id}" class="add-btn bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition duration-150">เพิ่มลงตะกร้า</button>
                    </div>
                </div>
            `).join('');
        }

        // Module 4: Financial Formula Calculations
        function updateFinancials() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = subtotal >= 2000 ? subtotal * 0.15 : 0;
            const afterDiscount = subtotal - discount;
            const tax = afterDiscount * 0.07;
            const grandTotal = afterDiscount + tax;

            subtotalVal.textContent = subtotal.toFixed(2);
            discountVal.textContent = discount.toFixed(2);
            taxVal.textContent = tax.toFixed(2);
            grandTotalVal.textContent = grandTotal.toFixed(2);
        }

        // Module 3 & 5: Render Cart & Persistence
        function renderCart() {
            if (cart.length === 0) {
                cartList.innerHTML = `<p class="text-center text-gray-400 py-6">ไม่มีสินค้าในตะกร้า</p>`;
            } else {
                cartList.innerHTML = cart.map(item => `
                    <div class="py-3 flex items-center justify-between">
                        <div class="pr-2">
                            <h4 class="font-medium text-sm text-gray-800">${item.name}</h4>
                            <span class="text-xs text-gray-500">${item.price.toFixed(2)} x ${item.quantity}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button data-id="${item.id}" class="qty-dec bg-gray-100 hover:bg-gray-200 text-gray-700 w-7 h-7 rounded-md flex items-center justify-center font-bold text-sm transition">-</button>
                            <span class="text-sm font-semibold w-6 text-center">${item.quantity}</span>
                            <button data-id="${item.id}" class="qty-inc bg-gray-100 hover:bg-gray-200 text-gray-700 w-7 h-7 rounded-md flex items-center justify-center font-bold text-sm transition">+</button>
                            <button data-id="${item.id}" class="remove-btn text-red-400 hover:text-red-600 text-xs font-medium ml-2 transition">ลบ</button>
                        </div>
                    </div>
                `).join('');
            }
            updateFinancials();
            saveCartState();
        }

        // Event Listeners for Filters
        searchInput.addEventListener('input', renderCatalog);
        categorySelect.addEventListener('change', renderCatalog);

        // Event Listener for Adding Products to Cart
        catalogGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('add-btn')) {
                const productId = parseInt(e.target.dataset.id);
                const product = products.find(p => p.id === productId);
                
                if (product) {
                    const existingItem = cart.find(item => item.id === productId);
                    if (existingItem) {
                        existingItem.quantity += 1;
                    } else {
                        cart.push({ ...product, quantity: 1 });
                    }
                    renderCart();
                }
            }
        });

        // Event Listener for Cart Mutations (Increment, Decrement, Remove)
        cartList.addEventListener('click', (e) => {
            const productId = parseInt(e.target.dataset.id);
            if (!productId) return;

            const index = cart.findIndex(item => item.id === productId);
            if (index === -1) return;

            if (e.target.classList.contains('qty-inc')) {
                cart[index].quantity += 1;
            } else if (e.target.classList.contains('qty-dec')) {
                cart[index].quantity -= 1;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            } else if (e.target.classList.contains('remove-btn')) {
                cart.splice(index, 1);
            }

            renderCart();
        });

        // Module 5: Checkout Validation and Persistence
        checkoutBtn.addEventListener('click', () => {
            const customerDetails = customerInput.value.trim();

            if (cart.length === 0) {
                alert('กรุณาเพิ่มสินค้าลงในตะกร้าก่อนทำการสั่งซื้อ');
                return;
            }

            if (!customerDetails) {
                alert('กรุณากรอกชื่อและที่อยู่สำหรับจัดส่งสินค้า');
                return;
            }

            const orderData = {
                customer: customerDetails,
                items: [...cart],
                subtotal: subtotalVal.textContent,
                discount: discountVal.textContent,
                tax: taxVal.textContent,
                grandTotal: grandTotalVal.textContent,
                createdAt: new Date().toISOString()
            };

            localStorage.setItem('app_last_order', JSON.stringify(orderData));
            alert('สั่งซื้อสินค้าสำเร็จ!');
            
            // Reset Cart and Form
            cart = [];
            customerInput.value = '';
            renderCart();
        });

        // Initial App Load
        renderCatalog();
        renderCart();
    </script>
</body>
</html>
