<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                📚 <span>CyberBook Store</span>
            </h1>
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <!-- 1. ช่องค้นหาชื่อหนังสือด้วยคีย์เวิร์ด -->
                <input type="text" id="search-input" placeholder="ค้นหาชื่อหนังสือ..." 
                    class="px-4 py-2 rounded-lg text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 w-full md:w-64 text-sm">
                
                <!-- 2. ดรอปดาวน์กรองหมวดหมู่หนังสือ -->
                <select id="category-select" 
                    class="px-4 py-2 rounded-lg text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm cursor-pointer">
                    <option value="all">ทุกหมวดหมู่</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Business">Business</option>
                    <option value="Tech">Tech</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Catalog Section (2 Columns on large screens) -->
        <section class="lg:col-span-2">
            <h2 class="text-xl font-semibold mb-4 text-slate-700 flex items-center gap-2">
                📖 รายการหนังสือทั้งหมด
            </h2>
            <!-- 3. พื้นที่แสดงรายการหนังสือ -->
            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- รายการหนังสือจะถูกเรนเดอร์ด้วย JavaScript -->
            </div>
        </section>

        <!-- Cart & Checkout Section -->
        <section class="bg-white p-6 rounded-xl shadow-md border border-slate-100 flex flex-col h-fit sticky top-6">
            <h2 class="text-xl font-semibold mb-4 text-slate-700 flex items-center gap-2 border-b pb-3">
                🛒 ตะกร้าสินค้าของคุณ
            </h2>

            <!-- 4. พื้นที่แสดงรายการในตะกร้าหนังสือ -->
            <div id="cart-list" class="divide-y divide-slate-100 max-h-72 overflow-y-auto mb-4 pr-1">
                <p class="text-slate-400 text-center py-6 text-sm">ตะกร้าสินค้าว่างเปล่า</p>
            </div>

            <!-- Financial Summary -->
            <div class="bg-slate-50 p-4 rounded-lg space-y-2 text-sm mb-6 border border-slate-200">
                <div class="flex justify-between text-slate-600">
                    <span>ยอดรวม (Subtotal):</span>
                    <span>฿<span id="subtotal-val">0.00</span></span>
                </div>
                <div class="flex justify-between text-emerald-600 font-medium">
                    <span>ส่วนลด (Discount):</span>
                    <span>-฿<span id="discount-val">0.00</span></span>
                </div>
                <div class="flex justify-between text-slate-600">
                    <span>ค่าจัดส่ง (Shipping Fee):</span>
                    <span>฿<span id="tax-val">0.00</span></span>
                </div>
                <div class="border-t border-slate-200 pt-2 flex justify-between font-bold text-lg text-slate-800">
                    <span>ยอดสุทธิ (Grand Total):</span>
                    <span class="text-indigo-600">฿<span id="grand-total-val">0.00</span></span>
                </div>
            </div>

            <!-- Customer Info & Checkout -->
            <div class="space-y-4">
                <div>
                    <label for="customer-input" class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อสมาชิกผู้สั่งซื้อ</label>
                    <!-- 9. ช่องกรอกชื่อสมาชิกผู้สั่งซื้อ -->
                    <input type="text" id="customer-input" placeholder="กรอกชื่อ-นามสกุลของคุณ" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- 10. ปุ่มยืนยันการสั่งซื้อหนังสือ -->
                <button id="checkout-btn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors shadow-sm text-sm">
                    ยืนยันการสั่งซื้อ
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 CyberBook Store System. All rights reserved.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Module 1: ข้อมูลหนังสือตั้งต้น (Array 6 เล่ม)
        const booksData = [
            { id: 1, title: "The Silent Forest", category: "Fiction", price: 180 },
            { id: 2, title: "Midnight Star", category: "Fiction", price: 220 },
            { id: 3, title: "Startup Zero", category: "Business", price: 280 },
            { id: 4, title: "Financial Freedom", category: "Business", price: 320 },
            { id: 5, title: "Clean Python Architecture", category: "Tech", price: 450 },
            { id: 6, title: "Deep Learning Systems", category: "Tech", price: 550 }
        ];

        // State ของตะกร้าสินค้า
        let cart = [];

        // โหลดข้อมูลตะกร้าจาก localStorage (Module 5)
        function loadCartFromStorage() {
            const savedCart = localStorage.getItem("app_cart_state");
            if (savedCart) {
                try {
                    cart = JSON.parse(savedCart);
                } catch (e) {
                    cart = [];
                }
            }
        }

        // บันทึกข้อมูลตะกร้าลง localStorage (Module 5)
        function saveCartToStorage() {
            localStorage.setItem("app_cart_state", JSON.stringify(cart));
        }

        // Module 2: ฟังก์ชันกรองและแสดงผลรายการหนังสือตาม Filter & Search
        function renderCatalog() {
            const keyword = document.getElementById("search-input").value.toLowerCase().trim();
            const selectedCategory = document.getElementById("category-select").value;

            const filteredBooks = booksData.filter(book => {
                const matchesKeyword = book.title.toLowerCase().includes(keyword);
                const matchesCategory = selectedCategory === "all" || book.category === selectedCategory;
                return matchesKeyword && matchesCategory;
            });

            const catalogGrid = document.getElementById("catalog-grid");
            
            if (filteredBooks.length === 0) {
                catalogGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">
                        ไม่พบหนังสือที่คุณค้นหา
                    </div>
                `;
                return;
            }

            catalogGrid.innerHTML = filteredBooks.map(book => `
                <div class="catalog-item bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-shadow">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">${book.category}</span>
                            <span class="font-bold text-slate-900">฿${book.price.toFixed(2)}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg mb-1">${book.title}</h3>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-end">
                        <button data-id="${book.id}" class="add-btn bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
                            + หยิบใส่ตะกร้า
                        </button>
                    </div>
                </div>
            `).join("");

            // ผูก Event ให้ปุ่ม .add-btn ทุกปุ่ม
            document.querySelectorAll(".add-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const bookId = parseInt(e.currentTarget.getAttribute("data-id"));
                    addToCart(bookId);
                });
            });
        }

        // Module 3: ฟังก์ชันจัดการตะกร้าสินค้า (Cart Mutation)
        function addToCart(bookId) {
            const book = booksData.find(b => b.id === bookId);
            if (!book) return;

            const cartItem = cart.find(item => item.id === bookId);
            if (cartItem) {
                cartItem.qty += 1;
            } else {
                cart.push({ ...book, qty: 1 });
            }

            saveAndRefresh();
        }

        function updateQuantity(bookId, change) {
            const itemIndex = cart.findIndex(item => item.id === bookId);
            if (itemIndex > -1) {
                cart[itemIndex].qty += change;
                if (cart[itemIndex].qty <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            saveAndRefresh();
        }

        function removeFromCart(bookId) {
            cart = cart.filter(item => item.id !== bookId);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            saveCartToStorage();
            renderCart();
            updateFinancials();
        }

        // เรนเดอร์รายการในตะกร้า
        function renderCart() {
            const cartList = document.getElementById("cart-list");

            if (cart.length === 0) {
                cartList.innerHTML = `<p class="text-slate-400 text-center py-6 text-sm">ตะกร้าสินค้าว่างเปล่า</p>`;
                return;
            }

            cartList.innerHTML = cart.map(item => `
                <div class="py-3 flex items-center justify-between gap-2">
                    <div class="flex-grow">
                        <h4 class="text-sm font-medium text-slate-800 line-clamp-1">${item.title}</h4>
                        <span class="text-xs text-slate-500">฿${item.price.toFixed(2)} x ${item.qty}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center border border-slate-200 rounded overflow-hidden">
                            <button data-id="${item.id}" class="qty-dec px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">-</button>
                            <span class="px-2 text-xs font-semibold">${item.qty}</span>
                            <button data-id="${item.id}" class="qty-inc px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors">+</button>
                        </div>
                        <button data-id="${item.id}" class="remove-btn text-rose-500 hover:text-rose-700 p-1 transition-colors" title="ลบรายการ">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join("");

            // ผูก Event ให้ปุ่มต่างๆ ในตะกร้า
            document.querySelectorAll(".qty-inc").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    updateQuantity(parseInt(e.currentTarget.getAttribute("data-id")), 1);
                });
            });

            document.querySelectorAll(".qty-dec").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    updateQuantity(parseInt(e.currentTarget.getAttribute("data-id")), -1);
                });
            });

            document.querySelectorAll(".remove-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    removeFromCart(parseInt(e.currentTarget.getAttribute("data-id")));
                });
            });
        }

        // Module 4: คำนวณสูตรทางการเงิน (Financial Formula)
        function updateFinancials() {
            let subtotal = 0;
            let totalQty = 0;

            cart.forEach(item => {
                subtotal += item.price * item.qty;
                totalQty += item.qty;
            });

            // Discount: ถ้าจำนวนรวม >= 3 เล่ม ลด 80.00 บาท มิฉะนั้น 0.00
            let discount = totalQty >= 3 ? 80.00 : 0.00;

            // Shipping Fee (tax-val): ถ้ามีหนังสืออย่างน้อย 1 เล่ม คิด 50.00 บาท ถ้าว่างเป็น 0.00
            let shippingFee = totalQty > 0 ? 50.00 : 0.00;

            // Grand Total = max(0, Subtotal - Discount) + Shipping Fee
            let grandTotal = Math.max(0, subtotal - discount) + shippingFee;

            // อัปเดตลงใน DOM ตาม ID ที่กำหนด (แสดงเฉพาะตัวเลขทศนิยม 2 ตำแหน่ง ห้ามมีสัญลักษณ์สกุลเงิน)
            document.getElementById("subtotal-val").textContent = subtotal.toFixed(2);
            document.getElementById("discount-val").textContent = discount.toFixed(2);
            document.getElementById("tax-val").textContent = shippingFee.toFixed(2);
            document.getElementById("grand-total-val").textContent = grandTotal.toFixed(2);
        }

        // Module 5: Validation และบันทึกคำสั่งซื้อ
        function handleCheckout() {
            const customerInput = document.getElementById("customer-input").value.trim();

            if (cart.length === 0) {
                alert("กรุณาเลือกหนังสืออย่างน้อย 1 เล่มใส่ตะกร้าก่อนทำการสั่งซื้อ");
                return;
            }

            if (!customerInput) {
                alert("กรุณากรอกชื่อสมาชิกผู้สั่งซื้อ");
                document.getElementById("customer-input").focus();
                return;
            }

            // คำนวณยอดสรุปครั้งสุดท้ายเพื่อบันทึก
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            let discount = totalQty >= 3 ? 80.00 : 0.00;
            let shippingFee = totalQty > 0 ? 50.00 : 0.00;
            let grandTotal = Math.max(0, subtotal - discount) + shippingFee;

            const orderData = {
                customer: customerInput,
                items: [...cart],
                subtotal: subtotal.toFixed(2),
                discount: discount.toFixed(2),
                shippingFee: shippingFee.toFixed(2),
                grandTotal: grandTotal.toFixed(2),
                timestamp: new Date().toISOString()
            };

            // บันทึกลง localStorage คีย์ "app_last_order"
            localStorage.setItem("app_last_order", JSON.stringify(orderData));

            alert(`สั่งซื้อสำเร็จ! ขอบคุณคุณ ${customerInput} ยอดชำระรวม ฿${grandTotal.toFixed(2)}`);

            // รีเซ็ตตะกร้า
            cart = [];
            document.getElementById("customer-input").value = "";
            saveAndRefresh();
        }

        // ผูก Event Listeners เริ่มต้น
        document.addEventListener("DOMContentLoaded", () => {
            loadCartFromStorage();
            renderCatalog();
            renderCart();
            updateFinancials();

            // Real-time Search & Filter Events
            document.getElementById("search-input").addEventListener("input", renderCatalog);
            document.getElementById("category-select").addEventListener("change", renderCatalog);

            // Checkout Button Event
            document.getElementById("checkout-btn").addEventListener("click", handleCheckout);
        });
    </script>
</body>
</html>
